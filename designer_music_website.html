<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTIST</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #111, #000);
      color: white;
      overflow-x: hidden;
    }

    /* ===== HEADER ===== */
    header {
      position:fixed;
      width:100%;
      display:flex;
      justify-content:space-between;
      padding:20px 40px;
      z-index:1000;
      background:rgba(0,0,0,0.4);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo {
      font-weight:800;
      font-size:22px;
      transition:0.3s;
    }

    /* ===== INTERACTIVE TEXT ===== */
    h1, h2, h3, p, a, .logo {
      transition:0.3s;
    }

    h1:hover, h2:hover, h3:hover, p:hover, a:hover, .logo:hover {
      color:#fff;
      text-shadow: 0 0 10px #ffffff, 0 0 25px #ffffff;
      transform: scale(1.02);
    }

    nav a {
      color:white;
      margin-left:25px;
      text-decoration:none;
      opacity:0.6;
      transition:0.3s;
    }

    nav a:hover {
      opacity:1;
      text-shadow: 0 0 10px #ffffff, 0 0 25px #ffffff;
    }

    /* ===== HERO ===== */
    .hero {
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .hero h1 {
      font-size:80px;
      letter-spacing:3px;
      text-shadow: 0 0 20px rgba(255,255,255,0.15);
    }

    .hero p {
      opacity:0.7;
      margin:20px 0 40px;
      font-size:18px;
    }

    /* ===== BUTTON ===== */
    .btn {
      padding:15px 45px;
      border-radius:50px;
      background: linear-gradient(90deg, #ffffff, #dcdcdc);
      color:black;
      font-weight:700;
      text-decoration:none;
      transition:0.3s;
      box-shadow: 0 0 0px #fff;
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px #ffffff, 0 0 40px #ffffff;
    }

    /* ===== SECTIONS ===== */
    .section {
      padding:120px 40px;
      max-width:1200px;
      margin:auto;
    }

    .section h2 {
      font-size:38px;
      margin-bottom:40px;
    }

    /* ===== TRACKS ===== */
    .tracks {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
      gap:25px;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      padding:25px;
      border-radius:25px;
      transition:0.5s;
      opacity:0;
      transform: translateY(40px);
      backdrop-filter: blur(10px);
    }

    .card.visible {
      opacity:1;
      transform: translateY(0);
    }

    .card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 0 25px rgba(255,255,255,0.25);
    }

    audio {
      width:100%;
      margin-top:10px;
    }

    /* ===== ABOUT ===== */
    .about {
      text-align:center;
      max-width:700px;
      margin:auto;
      opacity:0;
      transform: translateY(40px);
      transition:0.8s;
      line-height:1.6;
    }

    .about.visible {
      opacity:0.8;
      transform: translateY(0);
    }

    footer {
      text-align:center;
      padding:60px;
      opacity:0.4;
    }

    /* ===== SCROLL ANIMATION ===== */
    .reveal {
      opacity:0;
      transform: translateY(40px);
      transition:0.8s;
    }

    .reveal.visible {
      opacity:1;
      transform: translateY(0);
    }

  </style>
</head>
<body>

<header>
  <div class="logo">ARTIST</div>
  <nav>
    <a href="#">Главная</a>
    <a href="#tracks">Музыка</a>
    <a href="#about">Обо мне</a>
  </nav>
</header>

<section class="hero">
  <h1>ULTRA RELEASE</h1>
  <p>Погрузись в звук нового уровня</p>
  <a href="#tracks" class="btn">Слушать</a>
</section>

<section class="section" id="tracks">
  <h2>Музыка</h2>
  <div class="tracks">

    <div class="card reveal">
      <h3>Track One</h3>
      <p>2026</p>
      <audio controls>
        <source src="track.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="card reveal">
      <h3>Track Two</h3>
      <p>2026</p>
      <audio controls>
        <source src="track.mp3" type="audio/mpeg">
      </audio>
    </div>

  </div>
</section>

<section class="section" id="about">
  <h2>Обо мне</h2>
  <p class="about reveal">
    Это пространство для твоей истории. Музыка, стиль, энергия — всё здесь.
  </p>
</section>

<footer>
  © 2026 ARTIST
</footer>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
